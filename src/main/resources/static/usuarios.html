<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXA - Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">

        <span class="navbar-brand brand">
            NEXA <small class="js-comercio-nombre fw-normal ms-2" style="font-size:.6em;opacity:.8"></small>
        </span>

        <div>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="productos.html" class="btn btn-outline-light btn-sm">Productos</a>
        </div>

    </div>
</nav>

<div class="container pb-5">

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Usuarios del comercio</h5>
                <button class="btn btn-primary btn-sm" onclick="abrirNuevo()">+ Nuevo usuario</button>
            </div>

            <div id="alerta"></div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                    <tr><td colspan="5" class="text-center text-muted py-4">Cargando…</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<!-- MODAL CREAR / EDITAR -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Nuevo usuario</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="errUsuario" class="alert alert-danger d-none"></div>
                <input type="hidden" id="uId">
                <div class="row g-2">
                    <div class="col-6"><label class="form-label">Nombre</label><input id="uNombre" class="form-control"></div>
                    <div class="col-6"><label class="form-label">Apellido</label><input id="uApellido" class="form-control"></div>
                    <div class="col-6"><label class="form-label">Usuario</label><input id="uUsuario" class="form-control" autocomplete="off"></div>
                    <div class="col-6">
                        <label class="form-label">Contraseña <small class="text-muted" id="ayudaPassword"></small></label>
                        <input id="uPassword" type="password" class="form-control" autocomplete="new-password">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Rol</label>
                        <select id="uRol" class="form-select">
                            <option value="VENDEDOR">Vendedor</option>
                            <option value="ADMINISTRADOR">Administrador</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" onclick="guardar()">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/comercio.js"></script>
<script src="js/usuarios.js"></script>

</body>
</html>
