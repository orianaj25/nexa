spring.application.name=mayorista
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Pool chico para evitar errores de conexiones
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

server.error.include-message=always
server.error.include-binding-errors=always

debug=true

# ==========================================
# NEXA multi-comercio
# ==========================================
# Usuario y contraseña del SUPER_ADMIN (se crea en el primer arranque si no existe).
# Si no definís la contraseña, se genera una y se muestra UNA vez en los logs.
nexa.superadmin.usuario=${SUPERADMIN_USUARIO:superadmin}
nexa.superadmin.password=${SUPERADMIN_PASSWORD:}

# Nombre del comercio que recibe los datos que ya existían antes de pasar a multi-comercio.
nexa.comercio-inicial=${COMERCIO_INICIAL:Volga}
